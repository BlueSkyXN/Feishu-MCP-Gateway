# 手动发布：调用 ci.yml 运行与 PR 相同的检查，同时构建发布包并用源码包离线重建核对；都通过后创建草稿版本并生成构建证明。
# 草稿由维护者核对后手动发布。修改发布脚本、本工作流或 ci.yml 的 PR 运行检查、构建与核对，不创建版本。
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号，例如 v0.3.0-dev；只创建草稿版本
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - scripts/build_release.py
      - scripts/package_skill.py
      - scripts/verify_release.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 直接调用 ci.yml，发布前的检查与 PR 检查一致；修改发布流程的 PR 也运行，用来验证这次调用。
  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and verify archives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Resolve version
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="$INPUT_TAG"; else tag="v0.0.0-ci"; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::版本号需要形如 v0.3.0 或 v0.3.0-dev"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Fetch pinned lark-cli
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("internal/gateway/catalog.json"))["source_commit"])')
          git init -q "$RUNNER_TEMP/lark-cli"
          git -C "$RUNNER_TEMP/lark-cli" fetch -q --depth 1 https://github.com/larksuite/cli.git "$commit"
          git -C "$RUNNER_TEMP/lark-cli" checkout -q FETCH_HEAD
          echo "LARK_CLI=$RUNNER_TEMP/lark-cli" >> "$GITHUB_ENV"

      - name: Build release archives
        run: python3 scripts/build_release.py "$LARK_CLI" --tag "$TAG" --output "$RUNNER_TEMP/release"

      - name: Verify checksums and offline rebuild
        run: python3 scripts/verify_release.py "$RUNNER_TEMP/release" --output "$RUNNER_TEMP/RELEASE-VERIFY.json"

      - name: Collect assets
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$RUNNER_TEMP"/release/*.tar.gz "$RUNNER_TEMP/release/PROVENANCE.json" "$RUNNER_TEMP/release/SHA256SUMS" "$RUNNER_TEMP/RELEASE-VERIFY.json" "$RUNNER_TEMP/assets/"
          ls -l "$RUNNER_TEMP/assets"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft release
    needs: [checks, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: assets

      # 先建草稿再生成构建证明：草稿私有、可删除，构建证明写入公开透明日志后不能撤回。
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          {
            echo "源码提交：\`$GITHUB_SHA\`。lark-cli 提交：\`$(python3 -c 'import json; print(json.load(open("assets/PROVENANCE.json"))["lark_cli_commit"])')\`。"
            echo
            echo "附件由 GitHub Actions 构建，附 GitHub 构建证明；RELEASE-VERIFY.json 记录校验和与源码包离线重建的核对结果。"
          } > notes.md
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft $prerelease --title "Feishu-MCP-Gateway $TAG" --notes-file notes.md

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.tar.gz
            assets/PROVENANCE.json
